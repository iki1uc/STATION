<!DOCTYPE html>
<html>
<head>
<title>STATION CORE EXT</title>

<style>
body { background:#000; color:#0f0; font-family:Consolas; padding:20px; }
h2 { color:#6cf; }
pre { background:#111; border:1px solid #333; padding:12px; }
button { background:#222; color:#6cf; border:1px solid #333; padding:8px; margin-top:10px; }
button:hover { background:#333; color:#0f0; }
</style>

</head>

<body>

<h2>STATION CORE EXT</h2>

<p>CORE ist der zentrale Systemkern der STATION.</p>

<pre id="coreInfo">Lade CORE...</pre>

<button onclick="showIntegrity()">Integrität anzeigen</button>

<script src="core.ext.js"></script>

<script>
setTimeout(() => {
    const core = window.STATION_CORE_EXT;
    document.getElementById("coreInfo").innerText =
        JSON.stringify(core.cfg, null, 2);
}, 500);

function showIntegrity() {
    const results = window.STATION_CORE_INTEGRITY;
    alert(JSON.stringify(results, null, 2));
}
</script>

</body>
</html>
