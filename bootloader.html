<!DOCTYPE html>
<html>
<head>
<title>STATION BOOTLOADER</title>

<style>
body { background:#000; color:#0f0; font-family:Consolas; padding:20px; }
h1 { color:#6cf; }
pre { background:#111; border:1px solid #333; padding:12px; }
button { background:#222; color:#6cf; border:1px solid #333; padding:8px; margin-top:10px; }
button:hover { background:#333; color:#0f0; }
</style>

</head>

<body>

<h1>STATION BOOTLOADER</h1>
<p>Technischer Erststart der gesamten STATION.</p>

<pre id="bootInfo">Lade BOOTLOADER...</pre>

<button onclick="showBoot()">Bootloader anzeigen</button>

<script src="bootloader.js"></script>

<script>
setTimeout(() => {
    const boot = window.STATION_BOOTLOADER;
    document.getElementById("bootInfo").innerText =
        JSON.stringify(boot.cfg, null, 2);
}, 500);

function showBoot() {
    const boot = window.STATION_BOOTLOADER;
    alert(JSON.stringify(boot.cfg, null, 2));
}
</script>

</body>
</html>
