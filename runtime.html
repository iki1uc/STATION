<!DOCTYPE html>
<html>
<head>
<title>STATION RUNTIME</title>

<style>
body { background:#000; color:#0f0; font-family:Consolas; padding:20px; }
h1 { color:#6cf; }
pre { background:#111; border:1px solid #333; padding:12px; }
button { background:#222; color:#6cf; border:1px solid #333; padding:8px; margin-top:10px; }
button:hover { background:#333; color:#0f0; }
</style>

</head>

<body>

<h1>STATION RUNTIME</h1>
<p>Laufzeit der gesamten STATION.</p>

<pre id="runtimeInfo">Lade RUNTIME...</pre>

<button onclick="showRuntime()">Runtime anzeigen</button>

<script src="runtime.js"></script>

<script>
setTimeout(() => {
    const runtime = window.STATION_RUNTIME;
    document.getElementById("runtimeInfo").innerText =
        JSON.stringify(runtime.cfg, null, 2);
}, 500);

function showRuntime() {
    const runtime = window.STATION_RUNTIME;
    alert(JSON.stringify(runtime.cfg, null, 2));
}
</script>

</body>
</html>
