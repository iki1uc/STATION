<!DOCTYPE html>
<html>
<head>
<title>STATION RELEASE</title>

<style>
body { background:#000; color:#0f0; font-family:Consolas; padding:20px; }
h1 { color:#6cf; }
pre { background:#111; border:1px solid #333; padding:12px; }
button { background:#222; color:#6cf; border:1px solid #333; padding:8px; margin-top:10px; }
button:hover { background:#333; color:#0f0; }
</style>

</head>

<body>

<h1>STATION RELEASE</h1>
<p>Finales Release der gesamten STATION.</p>

<pre id="releaseInfo">Lade RELEASE...</pre>

<button onclick="showRelease()">Release anzeigen</button>

<script src="release.js"></script>

<script>
setTimeout(() => {
    const release = window.STATION_RELEASE;
    document.getElementById("releaseInfo").innerText =
        JSON.stringify(release.cfg, null, 2);
}, 500);

function showRelease() {
    const release = window.STATION_RELEASE;
    alert(JSON.stringify(release.cfg, null, 2));
}
</script>

</body>
</html>
