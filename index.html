<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>STATION · AXIS ENGINE · BORG‑CUBE</title>

<style>
    body { background:#000; color:#0f0; font-family:Consolas, monospace; padding:20px; }
    h1 { color:#ff00ff; text-shadow:0 0 10px #ff00ff; }
    .block { background:#111; padding:15px; border-left:4px solid #ff00ff; margin-bottom:20px; }
    pre { white-space:pre-wrap; background:#000; padding:12px; border-left:3px solid #00e0ff; }
</style>

</head>

<body>

<h1>STATION · AXIS ENGINE · BORG‑CUBE</h1>

<div class="block">
    <h2>AXIS 1</h2>
    <pre id="ax1"></pre>
</div>

<div class="block">
    <h2>AXIS 3</h2>
    <pre id="ax3"></pre>
</div>

<div class="block">
    <h2>AXIS 6</h2>
    <pre id="ax6"></pre>
</div>

<div class="block">
    <h2>BORG‑CUBE · PHÄNOMEN</h2>
    <pre id="cube"></pre>
</div>

<div class="block">
    <h2>WARP‑TUNNEL</h2>
    <pre id="warp"></pre>
</div>

<div class="block">
    <h2>AMIGA‑SCENE</h2>
    <pre id="amiga"></pre>
</div>

<div class="block">
    <h2>GTA‑6 ASCII LIVE</h2>
    <pre id="gta"></pre>
</div>

<script>
async function load(path) {
    return await fetch(path).then(r => r.text());
}

document.getElementById("ax1").innerText = await load("./1.room");
document.getElementById("ax3").innerText = await load("./3.room");
document.getElementById("ax6").innerText = await load("./6.room");

let frame = 0;

function cubeFrame() {
return `
                ▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓
           ▓▓▓▓                     ▓▓▓▓
       ▓▓▓                               ▓▓▓
    ▓▓▓                                     ▓▓▓
  ▓▓                                           ▓▓
 ▓                                               ▓
 ▓   AX1 → ●   (LEFT → CENTER)
 ▓   AX3 → ●   (CENTER → FORWARD)
 ▓   AX6 → ●   (RIGHT → OUT)
  ▓                                             ▓
    ▓▓                                     ▓▓▓
       ▓▓▓                               ▓▓▓
           ▓▓▓▓                     ▓▓▓▓
                ▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓

ROTATION: ${["↻","⟳","⟲"][frame % 3]}
`;
}

function warpFrame() {
return `
Depth: ${"●".repeat((frame % 5) + 1)}
Warp : ${"~".repeat((frame % 20) + 5)}
`;
}

function amigaFrame() {
const bar = "▓".repeat(20 + (frame % 10));
return `${bar}\n${bar}\n${bar}`;
}

function gtaFrame() {
const city = ["🔥──🚓──🏙", "🚓──🔥──🏙", "🏙──🚓──🔥"];
return `
${city[frame % 3]}
GTA‑6 ASCII LIVE
FRAME: ${frame}
`;
}

setInterval(() => {
    frame++;

    document.getElementById("cube").innerText = cubeFrame();
    document.getElementById("warp").innerText = warpFrame();
    document.getElementById("amiga").innerText = amigaFrame();
    document.getElementById("gta").innerText = gtaFrame();

}, 120);
</script>

</body>
</html>
