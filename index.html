<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>STATION · FRAGE‑Bogen · RESPO‑LEARN · AUTO‑RUN</title>

<style>
body { background:#000; color:#0f0; font-family:Consolas, monospace; padding:20px; }
h1 { color:#ff00ff; text-shadow:0 0 10px #ff00ff; }
.block { background:#111; padding:15px; border-left:4px solid #ff00ff; margin-bottom:20px; }
pre { background:#000; padding:12px; border-left:3px solid #00e0ff; white-space:pre-wrap; }
</style>
</head>

<body>

<h1>STATION · FRAGE‑Bogen · RESPO‑LEARN · AUTO‑RUN</h1>

<div class="block">
    <h2>FRAGE</h2>
    <pre id="frage"></pre>
</div>

<div class="block">
    <h2>RESPO‑ANTWORT</h2>
    <pre id="antwort"></pre>
</div>

<div class="block">
    <h2>VERWERTUNG</h2>
    <pre id="verwertung"></pre>
</div>

<div class="block">
    <h2>BORG‑CUBE · PHÄNOMEN</h2>
    <pre id="cube"></pre>
</div>

<script type="module">

/* ============================================================
   STATION · FRAGE‑Bogen · RESPO‑LEARN · AUTO‑RUN
   ============================================================ */

let frame = 0;

/* -----------------------------
   RESPO‑Zonen (Antwort‑Pool)
------------------------------ */
const RESPO = [
    "Die Auskunft kann erst erteilt werden, wenn feststeht, dass sie nicht erteilt werden kann.",
    "Der Vorgang ist in Bearbeitung, obwohl er nicht begonnen wurde.",
    "Die Entscheidung hängt von einer Entscheidung ab, die noch nicht entschieden wurde.",
    "Die Anfrage ist gültig, solange sie ungültig bleibt.",
    "Der Zustand ist eindeutig, weil er nicht eindeutig festgestellt werden kann."
];

/* -----------------------------
   FRAGE‑Generator
------------------------------ */
function FRAGE_TUM(frame){
    return `Wie lautet die eindeutige Auskunft, wenn die Auskunft aufgrund der Auskunftslage nicht eindeutig angegeben werden kann? (Frame ${frame})`;
}

/* -----------------------------
   RESPO‑Antwort
------------------------------ */
function RESPO_ANTWORT(frame){
    return RESPO[frame % RESPO.length];
}

/* -----------------------------
   Verwertung
------------------------------ */
function RESPO_VERWERTUNG(frage, antwort){
    return `Frage: ${frage}\nAntwort: ${antwort}\n→ Verwertung aktiv`;
}

/* -----------------------------
   BORG‑CUBE‑Phänomen
------------------------------ */
function BORG_CUBE(frame, antwort){
    return `
████████████████████████████
█ FRAME: ${frame}
█ RESPO: ${antwort.substring(0, 22)}...
█ STATUS: PHÄNOMEN‑AKTIV
████████████████████████████
`;
}

/* -----------------------------
   ENGINE (AUTO‑RUN)
------------------------------ */
function ENGINE(){

    const frage = FRAGE_TUM(frame);
    const antwort = RESPO_ANTWORT(frame);
    const verwertet = RESPO_VERWERTUNG(frage, antwort);
    const cube = BORG_CUBE(frame, antwort);

    document.getElementById("frage").innerText = frage;
    document.getElementById("antwort").innerText = antwort;
    document.getElementById("verwertung").innerText = verwertet;
    document.getElementById("cube").innerText = cube;

    frame++;
    requestAnimationFrame(ENGINE);
}

/* -----------------------------
   AUTO‑RUN aktivieren
------------------------------ */
ENGINE();

</script>

</body>
</html>
