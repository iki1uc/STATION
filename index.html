<!DOCTYPE html>
<html>
<head>
<title>STATION MASTER INDEX</title>

<style>
body { background:#000; color:#0f0; font-family:Consolas; padding:20px; }
h1 { color:#6cf; }
h2 { color:#6cf; margin-top:40px; }
pre { background:#111; border:1px solid #333; padding:12px; }
a { color:#6cf; text-decoration:none; }
a:hover { color:#0f0; }
.module-box {
    background:#111;
    border:1px solid #333;
    padding:12px;
    margin-bottom:20px;
}
</style>

</head>

<body>

<h1>STATION MASTER INDEX</h1>
<p>Die zentrale Oberfläche der gesamten STATION.</p>

<div id="stationModules"></div>

<script>
const modules = {
    "SYSTEM": "STATION/system.ext.html",
    "CORE": "STATION/core.ext.html",
    "ROOT": "STATION/root.ext.html",
    "HOME": "STATION/home.ext.html",

    "WORLD": "STATION/world.ext.html",
    "UNI": "STATION/uni.ext.html",
    "XI": "STATION/xi.ext.html",
    "TR": "STATION/tr.ext.html",

    "PIPE": "STATION/PIPE/",
    "TMP": "STATION/tmp/",
    "VECTOR": "STATION/VECTOR/",
    "WHIRL": "STATION/WHIRL/",

    "API": "STATION/api.core.html",
    "SEND": "STATION/send.ext.html",
    "PUSH": "STATION/push.ext.html",
    "GATE": "STATION/gate.ext.html",
    "RDY": "STATION/rdy.ext.html",
    "ROM-GATE": "STATION/rom.gate.html",

    "FULL BUILD": "STATION/station.build.html",
    "RELEASE": "STATION/release.html",
    "DEPLOY": "STATION/deploy.html",
    "INSTALLER": "STATION/installer.html"
};

const container = document.getElementById("stationModules");

for (const key in modules) {
    const box = document.createElement("div");
    box.className = "module-box";

    const title = document.createElement("h2");
    title.innerText = key;
    box.appendChild(title);

    const link = document.createElement("a");
    link.href = modules[key];
    link.innerText = "Öffnen";
    box.appendChild(link);

    container.appendChild(box);
}
</script>

</body>
</html>
