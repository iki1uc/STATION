<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>STATION · CORE · iki1uc</title>

<style>
body { background:#000; color:#0f0; font-family:monospace; padding:40px; }
h1 { color:#6cf; margin-bottom:30px; }
.block { background:#111; border:1px solid #333; padding:20px; margin-bottom:25px; border-radius:8px; }
.title { font-size:20px; color:#6cf; margin-bottom:10px; }
pre { background:#000; border-left:3px solid #6cf; padding:12px; white-space:pre-wrap; }
</style>

<!-- CORE MODULES -->
<script src="../SLIDE/tmp.hdf.resolver.js"></script>
<script type="module" src="../SLIDE/full.js"></script>
<script type="module" src="../SLIDE/transform.js"></script>
<script type="module" src="../SLIDE/geom.js"></script>
<script type="module" src="respo.hook.js"></script>

</head>
<body>

<h1>STATION · CORE · iki1uc</h1>

<div class="block">
    <div class="title">STATION‑LAGE</div>
    <pre id="station"></pre>
</div>

<div class="block">
    <div class="title">HDF‑LAGE</div>
    <pre id="hdf"></pre>
</div>

<div class="block">
    <div class="title">SLIDE‑ENGINE (12e)</div>
    <pre id="full"></pre>
</div>

<div class="block">
    <div class="title">6e</div>
    <pre id="sixE"></pre>
</div>

<div class="block">
    <div class="title">6d</div>
    <pre id="sixD"></pre>
</div>

<div class="block">
    <div class="title">GEOMETRIE</div>
    <pre id="geom"></pre>
</div>

<div class="block">
    <div class="title">station‑respo</div>
    <pre id="respo"></pre>
</div>

<div class="block">
    <div class="title">TMP‑Resolver</div>
    <pre id="resolver"></pre>
</div>

<script>
(async function () {

    /* STATION-LAGE */
    document.getElementById("station").innerText =
        "STATION = CORE / PIPE / LIVE / RESPO / GATE / TR / UNI / WORLD";

    /* HDF-LAGE */
    const hdfMatrix = await fetch("../HDF/81.room").then(r => r.text());
    document.getElementById("hdf").innerText = hdfMatrix;

    /* ENGINE */
    const t = TRANSFORM_12e_6e_6d_12e(12);

    document.getElementById("full").innerText = JSON.stringify(t.full, null, 2);
    document.getElementById("sixE").innerText = JSON.stringify(t.sixE, null, 2);
    document.getElementById("sixD").innerText = JSON.stringify(t.sixD, null, 2);

    /* GEOMETRIE */
    const geom = GEOM(t.sixD.x, t.sixD.y, t.sixD.z);
    document.getElementById("geom").innerText = JSON.stringify(geom, null, 2);

    /* station-respo */
    const stationRespo = {
        stability: t.sixD.y > t.sixD.x,
        vector: geom.vector,
        angles: geom,
        nat: t.sixD.z * 12,
        di: t.sixD.x + t.sixD.y + t.sixD.z,
        coord: t.sixD
    };
    document.getElementById("respo").innerText =
        JSON.stringify(stationRespo, null, 2);

    /* TMP LIST */
    const tmpList = await fetch("../HDF/tmp.list.json").then(r => r.json());

    /* RESOLVER */
    const results = [];
    for (const file of tmpList) {
        const content = await fetch("file://" + "D:/tmp/" + file)
            .then(r => r.text())
            .catch(() => "");
        const res = await TMP_HDF_RESOLVER.resolve(file, content);
        results.push(res);
    }
    document.getElementById("resolver").innerText =
        JSON.stringify(results, null, 2);

})();
</script>

</body>
</html>
