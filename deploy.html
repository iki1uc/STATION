<!DOCTYPE html>
<html>
<head>
<title>STATION DEPLOY</title>

<style>
body { background:#000; color:#0f0; font-family:Consolas; padding:20px; }
h1 { color:#6cf; }
pre { background:#111; border:1px solid #333; padding:12px; }
button { background:#222; color:#6cf; border:1px solid #333; padding:8px; margin-top:10px; }
button:hover { background:#333; color:#0f0; }
</style>

</head>

<body>

<h1>STATION DEPLOY</h1>
<p>Deployment der gesamten STATION.</p>

<pre id="deployInfo">Lade DEPLOY...</pre>

<button onclick="showDeploy()">Deploy anzeigen</button>

<script src="deploy.js"></script>

<script>
setTimeout(() => {
    const deploy = window.STATION_DEPLOY;
    document.getElementById("deployInfo").innerText =
        JSON.stringify(deploy.cfg, null, 2);
}, 500);

function showDeploy() {
    const deploy = window.STATION_DEPLOY;
    alert(JSON.stringify(deploy.cfg, null, 2));
}
</script>

</body>
</html>
